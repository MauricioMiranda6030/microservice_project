server:
  port: 8080

eureka:
  client:
    register-with-eureka: false

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: books
              uri: http://localhost:9090
              predicates:
                - Path=/api/book/**
            - id: publishers
              uri: http://localhost:9191
              predicates:
                - Path=/api/publisher/**